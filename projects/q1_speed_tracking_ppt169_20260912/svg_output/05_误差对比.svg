<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<g id="bg-plate">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>

<g id="p05-header">
<text x="80" y="88" font-family="&quot;Century Gothic&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="34" font-weight="bold" fill="#17375E">误差随速度全面上升，但有一个陷阱</text>
<rect x="80" y="100" width="56" height="5" fill="#FFC000"/>
<text x="1200" y="88" text-anchor="end" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="15" fill="#757070">EVIDENCE · 误差对比</text>
</g>

<g id="p05-lead">
<use data-icon="tabler-outline/trending-up" x="80" y="114" width="22" height="22" fill="#17375E" stroke-width="2"/>
<text x="114" y="134" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">稳态段与最大横向误差同步上升；精度排序 <tspan font-weight="bold" fill="#17375E">MPC &gt; LQR &gt; PP</tspan></text>
</g>

<g id="p05-chart">
<circle cx="206" cy="176" r="7" fill="#17375E"/>
<text x="222" y="182" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="15" fill="#757070">3 m/s</text>
<circle cx="316" cy="176" r="7" fill="#FFC000"/>
<text x="332" y="182" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="15" fill="#757070">7 m/s</text>
<text x="680" y="182" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">横向误差（m）</text>

