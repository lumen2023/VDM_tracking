<g id="p03-footer">
<text x="80" y="690" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="12" fill="#A6A6A6">03</text>
<text x="1200" y="690" text-anchor="end" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="12" fill="#A6A6A6">圆周转角与速度无关；峰值 aₙ 与 v²κ 理论与实测相对误差 ≤ 3.42%</text>
