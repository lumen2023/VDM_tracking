<g id="p06-summary">
<text x="280" y="180" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="26" font-weight="bold" fill="#17375E">aₙ = v²κ</text>
<text x="280" y="212" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">平方级 · 物理硬约束</text>

<line x1="460" y1="158" x2="460" y2="226" stroke="#D9D9D9" stroke-width="1"/>

<text x="640" y="180" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="26" font-weight="bold" fill="#17375E">e_ss ∝ L_f · β</text>
<text x="640" y="212" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">线性级 · 几何内切</text>

<line x1="820" y1="158" x2="820" y2="226" stroke="#D9D9D9" stroke-width="1"/>

<text x="1000" y="180" text-anchor="middle" font-family="Consolas, &quot;Courier New&quot;, monospace" font-size="26" font-weight="bold" fill="#17375E">Δs = v · dt</text>
<text x="1000" y="212" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">1/v 级 · 修正拍数减少</text>
</g>

<line x1="80" y1="262" x2="1200" y2="262" stroke="#D9D9D9" stroke-width="1"/>

<g id="p06-rec1">
<circle cx="106" cy="390" r="26" fill="#17375E"/>
<text x="106" y="397" text-anchor="middle" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">01</text>
<text x="164" y="399" font-family="&quot;Century Gothic&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="bold" fill="#17375E">前视距离不能盲目随速度增大</text>
<text x="164" y="435" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">改用曲率前馈或转角偏置补偿，直接抵消 L_f · β 带来的稳态内切。</text>
</g>

<g id="p06-rec2">
<circle cx="106" cy="540" r="26" fill="#17375E"/>
<text x="106" y="547" text-anchor="middle" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">02</text>
<text x="164" y="549" font-family="&quot;Century Gothic&quot;, &quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, sans-serif" font-size="26" font-weight="bold" fill="#17375E">终点减速按剩余弧长触发</text>
<text x="164" y="585" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">高速时制动距离更长，只看当前距离触发，必然冲过终点。</text>
