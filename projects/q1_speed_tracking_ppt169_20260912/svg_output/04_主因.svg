<text x="114" y="222" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">13 组受控实验回归 · 最大残差 0.0227 m · 决定性对照：令 lf/lr → (2.5, 0)，则 β = 0 → 内切量 −0.0423 m</text>

<text x="114" y="254" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">机理链：速度 v ↑ <tspan font-weight="bold" fill="#FFC000">→</tspan> 前视距离 L_f = L₀ + 0.35v ↑ <tspan font-weight="bold" fill="#FFC000">→</tspan> 稳态内切量 ↑</text>
