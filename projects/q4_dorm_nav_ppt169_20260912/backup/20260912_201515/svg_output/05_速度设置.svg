<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
<feOffset dx="0" dy="2" result="offsetBlur"/>
<feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
<feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<g id="bg">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>

<g id="header">
<text x="80" y="98" font-family="&quot;Century Gothic&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="34" font-weight="bold" fill="#17375E">速度设置：把曲率翻译成限速</text>
<rect x="80" y="114" width="56" height="5" fill="#FFC000"/>
<text x="1200" y="98" text-anchor="end" font-family="&quot;Consolas&quot;, &quot;Courier New&quot;, monospace" font-size="20" fill="#002060">v = √(a<tspan font-size="15">lat,max</tspan> / κ)</text>
</g>

<g id="kpi-1">
<rect x="80" y="150" width="357" height="140" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="80" y="170" width="6" height="46" fill="#FFC000"/>
<text x="108" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">峰值侧向加速度</text>
<text x="108" y="248" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">4.34 m/s²</text>
<text x="108" y="274" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">同一路径匀速时为 7.30，降幅 41%</text>
</g>

<g id="kpi-2">
<rect x="461" y="150" width="357" height="140" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="461" y="170" width="6" height="46" fill="#FFC000"/>
<text x="489" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">规划减速度</text>
<text x="489" y="248" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">1.75 m/s²</text>
<text x="489" y="274" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">减速斜坡的斜率，取轮胎极限的一半</text>
</g>

<g id="kpi-3">
<rect x="842" y="150" width="357" height="140" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="842" y="170" width="6" height="46" fill="#FFC000"/>
<text x="870" y="188" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">减速提前量</text>
<text x="870" y="248" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">15 m</text>
<text x="870" y="274" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">从曲率峰值往前铺的减速斜坡</text>
</g>

<g id="recurrence-note">
<text x="80" y="326" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">关键坑：限速必须<tspan font-weight="bold" fill="#E92E25">逐点递推</tspan>——减速段从后往前扫一遍，加速段再从前往后扫一遍，写成一次性数组运算会漏掉相邻点。</text>
</g>

<g id="speed-image">
<image href="../images/fig4_speed_profile.png" x="290" y="348" width="700" height="315" preserveAspectRatio="xMidYMid meet"/>
<text x="640" y="676" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">速度剖面：每个拐点前都提前把车速压到该处曲率允许的上限</text>
</g>

<g id="footer">
<text x="80" y="700" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="12" fill="#A6A6A6">05</text>
<rect x="1237.6" y="664" width="19.1" height="40" fill="#FFC000"/>
</g>
</svg>
