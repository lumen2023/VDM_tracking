<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
<filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
<feOffset dx="0" dy="2" result="offsetBlur"/>
<feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
<feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
<feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<g id="bg">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>

<g id="header">
<text x="80" y="98" font-family="&quot;Century Gothic&quot;, &quot;Microsoft YaHei&quot;, sans-serif" font-size="34" font-weight="bold" fill="#17375E">地图构建：把 OSM 原始数据变成一张能搜索的路网</text>
<rect x="80" y="114" width="56" height="5" fill="#FFC000"/>
</g>

<g id="kpi-1">
<rect x="80" y="150" width="258" height="180" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="80" y="174" width="6" height="56" fill="#FFC000"/>
<text x="110" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">路网节点</text>
<text x="110" y="266" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">1,745</text>
<text x="110" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">合并同一交叉口后的顶点</text>
</g>

<g id="kpi-2">
<rect x="362" y="150" width="258" height="180" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="362" y="174" width="6" height="56" fill="#FFC000"/>
<text x="392" y="202" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">路段边</text>
<text x="392" y="266" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">1,989</text>
<text x="392" y="300" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">可通行的道路段</text>
</g>

<g id="kpi-3">
<rect x="80" y="350" width="258" height="180" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="80" y="374" width="6" height="56" fill="#FFC000"/>
<text x="110" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">路网总长</text>
<text x="110" y="466" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#17375E">146.7 km</text>
<text x="110" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">校园及周边可行驶道路</text>
</g>

<g id="kpi-4">
<rect x="362" y="350" width="258" height="180" rx="8" fill="#F2F2F2" filter="url(#cardShadow)"/>
<rect x="362" y="374" width="6" height="56" fill="#2E7D32"/>
<text x="392" y="402" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">连通分量</text>
<text x="392" y="466" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="36" font-weight="bold" fill="#2E7D32">1</text>
<text x="392" y="500" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">全图连通，任意两点可达</text>
</g>

<g id="route-note">
<text x="80" y="576" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">起点、终点先吸附到最近节点（偏离 44.4 m / 74.5 m），再用 Dijkstra 搜索。</text>
<text x="80" y="610" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="20" fill="#404040">得到参考路径：<tspan font-weight="bold" fill="#17375E">54 个节点</tspan>，原始折线长 <tspan font-weight="bold" fill="#17375E">1463.5 m</tspan>；倒圆角后 1450.6 m。</text>
<text x="80" y="648" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">整条链路离线运行，不依赖任何在线地图服务。</text>
</g>

<g id="road-graph-image">
<image href="../images/fig1_road_graph.png" x="683" y="150" width="494" height="470" preserveAspectRatio="xMidYMid meet"/>
<text x="930" y="644" text-anchor="middle" font-family="&quot;Microsoft YaHei&quot;, &quot;PingFang SC&quot;, Arial, sans-serif" font-size="15" fill="#757070">路网图：灰点为节点，高亮为本次参考路径</text>
</g>

<g id="footer">
<text x="80" y="700" font-family="&quot;Century Gothic&quot;, Arial, sans-serif" font-size="12" fill="#A6A6A6">03</text>
<rect x="1237.6" y="664" width="19.1" height="40" fill="#FFC000"/>
</g>
</svg>
